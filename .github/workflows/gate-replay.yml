# Replays the GoNoGo gate on two real, merged nasa/fprime pull requests (graphs committed in data/replay/)
# and checks the expected outcome of each, so the gate's behaviour on real history is tested on every push.
#   #5170 "TlmChan hash improvements": adds TLC-005/006 to a component that cites its other requirements,
#         with no citing test case                                   -> expected FAIL
#   #5291 "Reject invalid PVN in SpacePacketDeframer": adds SVC-CCSDS-SPD-010 to a component that does not use
#         REQUIREMENT() at all                                        -> expected PASS with a warning
name: Gate replay on real F´ PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: "5170"
            base: d833799
            head: bf71d97
            expect: FAIL
          - pr: "5291"
            base: acaa3fb
            head: 9a4d173
            expect: PASS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install relate-db
      - name: Gate on nasa/fprime PR #${{ matrix.pr }}
        run: |
          set +e
          python -m gonogo check --base data/replay/pr${{ matrix.pr }}-${{ matrix.base }}.json \
            --head data/replay/pr${{ matrix.pr }}-${{ matrix.head }}.json \
            --files-from data/replay/pr${{ matrix.pr }}-files.txt --markdown report.md
          code=$?
          set -e
          { echo "### Replay of nasa/fprime#${{ matrix.pr }} (expected ${{ matrix.expect }})"; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
          got=$([ "$code" = "0" ] && echo PASS || echo FAIL)
          echo "gate said $got, expected ${{ matrix.expect }}"
          [ "$got" = "${{ matrix.expect }}" ]

  action-selftest:
    name: Composite action end to end on nasa/fprime PR #5170
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GoNoGo (the action)
        uses: actions/checkout@v4
        with:
          path: gonogo
      - name: Checkout nasa/fprime at the merge commit of PR #5170
        uses: actions/checkout@v4
        with:
          repository: nasa/fprime
          ref: bf71d97e6c17c75831421dfc9104853e0bff556f
          path: fprime
          fetch-depth: 0
          filter: blob:none
      - name: Run the GoNoGo gate action
        id: gate
        uses: ./gonogo
        with:
          path: fprime
          base: d83379994130f5cc46b3a5a135bf9b8838295110
          fail-on-fail: "false"
      - name: Expect FAIL (TLC-005/006 added without citing tests)
        run: |
          echo "action result: ${{ steps.gate.outputs.result }}"
          [ "${{ steps.gate.outputs.result }}" = "FAIL" ]
