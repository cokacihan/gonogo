# GoNoGo traceability gate for an F´ repository, as a composite GitHub Action.
#
#   - uses: actions/checkout@v4
#     with: { fetch-depth: 0 }
#   - uses: cokacihan/tracegraph@main
#     with:
#       base: ${{ github.event.pull_request.base.sha }}
#
# It imports the base and head commits of the checked-out F´ repository into two Relate graphs, compares them,
# lists the unit tests to re-run for the changed files, writes the report to the job summary and fails the step
# when the gate says FAIL.
name: GoNoGo traceability gate
description: Requirement-to-test traceability gate and test-impact report for F´ flight-software repositories, on Relate.
branding:
  icon: check-circle
  color: green
inputs:
  base:
    description: Base commit to compare against (e.g. the pull request base SHA)
    required: true
  head:
    description: Head commit (defaults to the checked-out HEAD)
    required: false
    default: HEAD
  path:
    description: Path of the F´ repository checkout
    required: false
    default: .
  fail-on-fail:
    description: Fail the step when the gate says FAIL
    required: false
    default: "true"
outputs:
  result:
    description: PASS or FAIL
    value: ${{ steps.gate.outputs.result }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install GoNoGo's dependency
      shell: bash
      run: python -m pip install --quiet relate-db
    - name: Import base and head into Relate graphs and run the gate
      id: gate
      shell: bash
      env:
        GONOGO: ${{ github.action_path }}
        REPO: ${{ inputs.path }}
        BASE: ${{ inputs.base }}
        HEAD_REF: ${{ inputs.head }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/gonogo"; mkdir -p "$work"
        git -C "$REPO" worktree add --detach "$work/base" "$BASE"
        git -C "$REPO" diff --name-only "$BASE" "$HEAD_REF" > "$work/files.txt"
        export PYTHONPATH="$GONOGO"
        python -m gonogo import-fprime --repo "$work/base" --out "$work/base.json"
        python -m gonogo import-fprime --repo "$REPO" --out "$work/head.json"
        set +e
        python -m gonogo check --base "$work/base.json" --head "$work/head.json" \
          --files-from "$work/files.txt" --markdown "$work/report.md"
        code=$?
        set -e
        cat "$work/report.md" >> "$GITHUB_STEP_SUMMARY"
        if [ "$code" = "0" ]; then echo "result=PASS" >> "$GITHUB_OUTPUT"; else echo "result=FAIL" >> "$GITHUB_OUTPUT"; fi
        git -C "$REPO" worktree remove --force "$work/base"
    - name: Enforce the gate
      if: ${{ inputs.fail-on-fail == 'true' && steps.gate.outputs.result == 'FAIL' }}
      shell: bash
      run: |
        echo "GoNoGo traceability gate: FAIL (see the job summary)"
        exit 1
